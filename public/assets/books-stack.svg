<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgBooks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#edebe9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgBooks)"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="246" rx="120" ry="12" fill="#d2d0ce" opacity="0.6"/>

  <!-- Bottom Book (Blue) -->
  <g transform="translate(80, 196)">
    <rect x="0" y="0" width="240" height="36" rx="4" fill="#0078d4"/>
    <rect x="22" y="5" width="210" height="26" rx="2" fill="#faf9f8"/>
    <line x1="22" y1="12" x2="230" y2="12" stroke="#e1dfdd" stroke-width="1.5"/>
    <line x1="22" y1="18" x2="230" y2="18" stroke="#e1dfdd" stroke-width="1.5"/>
    <line x1="22" y1="24" x2="230" y2="24" stroke="#e1dfdd" stroke-width="1.5"/>
    <rect x="0" y="0" width="22" height="36" rx="3" fill="#005a9e"/>
    <line x1="8" y1="4" x2="8" y2="32" stroke="#deecf9" stroke-width="1.5"/>
  </g>

  <!-- Middle Book (Green) -->
  <g transform="translate(95, 150)">
    <rect x="0" y="0" width="215" height="34" rx="4" fill="#107c41"/>
    <rect x="20" y="5" width="188" height="24" rx="2" fill="#faf9f8"/>
    <line x1="20" y1="12" x2="205" y2="12" stroke="#e1dfdd" stroke-width="1.5"/>
    <line x1="20" y1="18" x2="205" y2="18" stroke="#e1dfdd" stroke-width="1.5"/>
    <line x1="20" y1="24" x2="205" y2="24" stroke="#e1dfdd" stroke-width="1.5"/>
    <rect x="0" y="0" width="20" height="34" rx="3" fill="#0b5a2f"/>
    <line x1="7" y1="4" x2="7" y2="30" stroke="#dff6dd" stroke-width="1.5"/>
  </g>

  <!-- Top Book (Red/Orange with Ribbon) -->
  <g transform="translate(110, 106)">
    <rect x="0" y="0" width="190" height="32" rx="4" fill="#d83b01"/>
    <rect x="18" y="5" width="165" height="22" rx="2" fill="#faf9f8"/>
    <line x1="18" y1="11" x2="180" y2="11" stroke="#e1dfdd" stroke-width="1.5"/>
    <line x1="18" y1="16" x2="180" y2="16" stroke="#e1dfdd" stroke-width="1.5"/>
    <line x1="18" y1="21" x2="180" y2="21" stroke="#e1dfdd" stroke-width="1.5"/>
    <rect x="0" y="0" width="18" height="32" rx="3" fill="#a82a00"/>
    <!-- Yellow Ribbon hanging out -->
    <path d="M 140 20 L 140 50 L 148 44 L 156 50 L 156 20 Z" fill="#ffb900"/>
  </g>
</svg>

