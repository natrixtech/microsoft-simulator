<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgHeadphones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6fc"/>
      <stop offset="100%" stop-color="#deecf9"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005a9e"/>
      <stop offset="50%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgHeadphones)"/>
  <!-- Headband arc -->
  <path d="M 115 165 C 115 70, 285 70, 285 165" fill="none" stroke="url(#bandGrad)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 130 145 C 130 90, 270 90, 270 145" fill="none" stroke="#2b579a" stroke-width="6" stroke-linecap="round"/>
  <!-- Left earpiece -->
  <g transform="translate(90, 140)">
    <rect x="0" y="0" width="34" height="74" rx="17" fill="#106ebe"/>
    <rect x="22" y="6" width="18" height="62" rx="9" fill="#201f1e"/>
    <rect x="8" y="18" width="10" height="38" rx="5" fill="#deecf9"/>
  </g>
  <!-- Right earpiece -->
  <g transform="translate(276, 140)">
    <rect x="6" y="0" width="34" height="74" rx="17" fill="#106ebe"/>
    <rect x="0" y="6" width="18" height="62" rx="9" fill="#201f1e"/>
    <rect x="22" y="18" width="10" height="38" rx="5" fill="#deecf9"/>
  </g>
  <!-- Sound accent dots -->
  <circle cx="65" cy="177" r="4" fill="#0078d4" opacity="0.6"/>
  <circle cx="50" cy="177" r="3" fill="#0078d4" opacity="0.4"/>
  <circle cx="335" cy="177" r="4" fill="#0078d4" opacity="0.6"/>
  <circle cx="350" cy="177" r="3" fill="#0078d4" opacity="0.4"/>
</svg>

