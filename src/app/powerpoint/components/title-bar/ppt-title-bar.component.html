        <rect x="3" y="3" width="18" height="18" rx="3" fill="#ffffff"/>
        <path d="M8.5 7h4.25a3.25 3.25 0 0 1 0 6.5H10.5V17h-2V7zm2 2v2.5h2.25a1.25 1.25 0 0 0 0-2.5H10.5z" fill="#C43E1C"/>

    <div class="document-name-display">

    </div>
  </div>
</header>
