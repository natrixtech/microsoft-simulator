<footer class="ppt-statusbar" role="contentinfo">
  <!-- Left info -->
  <div class="statusbar-left">
    <span class="slide-count-indicator">Slide {{ currentSlideIndex + 1 }} of {{ totalSlides }}</span>
  </div>

  <!-- Right view modes and zoom -->
  <div class="statusbar-right">
    <!-- Notes toggle (disabled) -->
    <button type="button" class="status-btn" disabled title="Notes (disabled)" data-demo-target="status-notes">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M2 2h10v12H2V2zm1 1v10h8V3H3zm2 2h4v1H5V5zm0 2h4v1H5V7zm0 2h3v1H5V9z"/></svg>
      <span>Notes</span>
    </button>

    <div class="status-separator"></div>

    <!-- View Mode Buttons -->
    <button type="button" class="status-icon-btn active" title="Normal" data-demo-target="status-view-normal">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><rect x="2" y="2" width="3" height="12" fill="#888"/><rect x="6" y="2" width="8" height="12" fill="currentColor"/></svg>
    </button>

    <button type="button" class="status-icon-btn" disabled title="Slide Sorter (disabled)" data-demo-target="status-view-sorter">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>
    </button>

    <button type="button" class="status-icon-btn" disabled title="Reading View (disabled)" data-demo-target="status-view-reading">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1 3a1 1 0 0 1 1-1h5v11H2a1 1 0 0 1-1-1V3zm14 0a1 1 0 0 0-1-1H9v11h5a1 1 0 0 0 1-1V3z"/></svg>
    </button>

    <button type="button" class="status-icon-btn" disabled title="Slide Show (disabled)" data-demo-target="status-view-slideshow">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><polygon points="5,3 13,8 5,13"/></svg>
    </button>

    <div class="status-separator"></div>

    <!-- Zoom controls -->
    <button type="button" class="status-icon-btn zoom-btn" disabled title="Zoom Out (disabled)" data-demo-target="status-zoom-out">
      <span>−</span>
    </button>

    <div class="zoom-slider-track">
      <div class="zoom-slider-thumb"></div>
    </div>

    <button type="button" class="status-icon-btn zoom-btn" disabled title="Zoom In (disabled)" data-demo-target="status-zoom-in">
      <span>+</span>
    </button>

    <span class="zoom-percent-text">{{ fitPercent }}%</span>

    <!-- Fit slide to current window button (ENABLED) -->
    <button
      type="button"
      class="status-icon-btn fit-btn"
      title="Fit slide to current window"
      data-demo-target="status-zoom-fit"
      (click)="refit.emit()"
    >
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
        <rect x="2" y="3" width="12" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M5 6l-2-2m0 0h2m-2 0v2m8-2l2 2m0-2h-2m2 0v2m-8 6l-2 2m0 0h2m-2 0v-2m8 2l2-2m0 2h-2m2 0v-2" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </div>
</footer>
