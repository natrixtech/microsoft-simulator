<span class="ppt-icon-wrapper" [style.width.px]="size" [style.height.px]="size" [ngSwitch]="name">
  <!-- Undo -->
  <svg *ngSwitchCase="'undo'" viewBox="0 0 24 24" fill="none">
    <path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 8h6a7 7 0 0 1 7 7v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>

  <!-- Redo -->
  <svg *ngSwitchCase="'redo'" viewBox="0 0 24 24" fill="none">
    <path d="M14 4l4 4-4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 8h-6a7 7 0 0 0-7 7v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>

  <!-- Paste -->
  <svg *ngSwitchCase="'paste'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M4 2v2H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1V2a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1zm1 0h4v2H5V2zm-2 3h8v9H3V5zm8-1h2v10h-2V4z" fill="#0078d4"/>
    <path d="M5 8h4v1H5V8zm0 2h4v1H5v-1zm0 2h3v1H5v-1z" fill="#c43e1c"/>
  </svg>

  <!-- Cut -->
  <svg *ngSwitchCase="'cut'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M12.5 1.5l-5 6.5-5-6.5-.8.6 4.8 6.2a2.5 2.5 0 1 0 1 .8l1-1.3 1 1.3a2.5 2.5 0 1 0 1-.8L6.7 8.3l4.8-6.2-.8-.6zM4.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
  </svg>

  <!-- Copy -->
  <svg *ngSwitchCase="'copy'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M4 2h7v1H4v9H3V3a1 1 0 0 1 1-1zm2 3h7a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm0 1v8h7V6H6z"/>
  </svg>

  <!-- Format Painter -->
  <svg *ngSwitchCase="'format-painter'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2 2h8v4H9V5H3v1H2V2zm9 1v1h3v1h-3v1h4V3h-4zM5 7h2v6H5V7z" fill="#e8a838"/>
  </svg>

  <!-- New Slide -->
  <svg *ngSwitchCase="'new-slide'" viewBox="0 0 24 24" fill="none">
    <rect x="2" y="4" width="20" height="15" rx="1.5" stroke="#c43e1c" stroke-width="2" fill="#fff5f2"/>
    <rect x="5" y="7" width="14" height="3" rx="0.5" fill="#c43e1c"/>
    <circle cx="18" cy="18" r="5" fill="#107c41"/>
    <path d="M18 15.5v5M15.5 18h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <!-- Layout -->
  <svg *ngSwitchCase="'layout'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M1 2a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2zm1 0v4h12V2H2zm0 5v7h5V7H2zm6 0v7h6V7H8z" fill="#0078d4"/>
  </svg>

  <!-- Reset -->
  <svg *ngSwitchCase="'reset'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
    <path d="M8 0v4l3-2-3-2z"/>
  </svg>

  <!-- Section -->
  <svg *ngSwitchCase="'section'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2 3h12v1H2V3zm0 4h8v1H2V7zm0 4h12v1H2v-1z"/>
  </svg>

  <!-- Bold -->
  <svg *ngSwitchCase="'bold'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M3 2h5.5a3.5 3.5 0 0 1 2.45 6A3.5 3.5 0 0 1 9 14H3V2zm3 2v3h2.5a1.5 1.5 0 0 0 0-3H6zm0 5v3h3a1.5 1.5 0 0 0 0-3H6z" font-weight="bold"/>
  </svg>

  <!-- Italic -->
  <svg *ngSwitchCase="'italic'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M6 2h6v2h-2.2l-2.6 8H9v2H3v-2h2.2l2.6-8H6V2z"/>
  </svg>

  <!-- Underline -->
  <svg *ngSwitchCase="'underline'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M4 2v6a4 4 0 0 0 8 0V2h-2v6a2 2 0 1 1-4 0V2H4zm-1 11h10v1.5H3V13z"/>
  </svg>

  <!-- Text Shadow -->
  <svg *ngSwitchCase="'text-shadow'" viewBox="0 0 16 16" fill="currentColor">
    <text x="1" y="11" font-size="12" font-weight="bold" fill="#bbb">S</text>
    <text x="3" y="13" font-size="12" font-weight="bold" fill="currentColor">S</text>
  </svg>

  <!-- Strikethrough -->
  <svg *ngSwitchCase="'strikethrough'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2 8h12v1.5H2V8zm6.5-6C6 2 4.5 3 4.5 4.5h2c0-.5.8-1 2-1 1.2 0 2 .5 2 1.2 0 .8-.6 1.1-1.5 1.3L8 6.2v1.3h1v-.5c1.5-.4 2.5-1.3 2.5-2.5C11.5 3 10 2 8.5 2zM5.5 11.5c.5.5 1.5 1 3 1 1.5 0 2.2-.6 2.2-1.2 0-.5-.3-.8-.8-1H8c-2 .4-3.5 1.2-3.5 2.2z"/>
  </svg>

  <!-- Font Color -->
  <svg *ngSwitchCase="'font-color'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M7.1 2h1.8l3.6 10h-1.8l-.9-2.6H6.2L5.3 12H3.5L7.1 2zm2.1 6.1L8 4.7 6.8 8.1h2.4z"/>
    <rect x="2" y="13" width="12" height="2.5" fill="#c43e1c"/>
  </svg>

  <!-- Highlight -->
  <svg *ngSwitchCase="'highlight'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8.5 2l5 5-7 7H2v-4.5l6.5-7.5zm.7 2.1L4.2 9.1V12h2.9l5-5-2.9-2.9z" fill="#f1c232"/>
    <rect x="2" y="13" width="12" height="2" fill="#f1c232"/>
  </svg>

  <!-- Bullets -->
  <svg *ngSwitchCase="'bullets'" viewBox="0 0 16 16" fill="currentColor">
    <circle cx="3" cy="4" r="1.5"/>
    <rect x="6" y="3" width="9" height="2" rx="0.5"/>
    <circle cx="3" cy="8" r="1.5"/>
    <rect x="6" y="7" width="9" height="2" rx="0.5"/>
    <circle cx="3" cy="12" r="1.5"/>
    <rect x="6" y="11" width="9" height="2" rx="0.5"/>
  </svg>

  <!-- Numbering -->
  <svg *ngSwitchCase="'numbering'" viewBox="0 0 16 16" fill="currentColor">
    <text x="1" y="5.5" font-size="6" font-family="sans-serif" font-weight="bold">1.</text>
    <rect x="6" y="3" width="9" height="2" rx="0.5"/>
    <text x="1" y="9.5" font-size="6" font-family="sans-serif" font-weight="bold">2.</text>
    <rect x="6" y="7" width="9" height="2" rx="0.5"/>
    <text x="1" y="13.5" font-size="6" font-family="sans-serif" font-weight="bold">3.</text>
    <rect x="6" y="11" width="9" height="2" rx="0.5"/>
  </svg>

  <!-- Align Left -->
  <svg *ngSwitchCase="'align-left'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="3" width="12" height="1.8" rx="0.5"/>
    <rect x="2" y="6.5" width="8" height="1.8" rx="0.5"/>
    <rect x="2" y="10" width="12" height="1.8" rx="0.5"/>
    <rect x="2" y="13.5" width="6" height="1.8" rx="0.5"/>
  </svg>

  <!-- Align Center -->
  <svg *ngSwitchCase="'align-center'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="3" width="12" height="1.8" rx="0.5"/>
    <rect x="4" y="6.5" width="8" height="1.8" rx="0.5"/>
    <rect x="2" y="10" width="12" height="1.8" rx="0.5"/>
    <rect x="5" y="13.5" width="6" height="1.8" rx="0.5"/>
  </svg>

  <!-- Align Right -->
  <svg *ngSwitchCase="'align-right'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="3" width="12" height="1.8" rx="0.5"/>
    <rect x="6" y="6.5" width="8" height="1.8" rx="0.5"/>
    <rect x="2" y="10" width="12" height="1.8" rx="0.5"/>
    <rect x="8" y="13.5" width="6" height="1.8" rx="0.5"/>
  </svg>

  <!-- Line Spacing -->
  <svg *ngSwitchCase="'line-spacing'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2.5 4.5l2-2.5 2 2.5h-1.5v7h1.5l-2 2.5-2-2.5h1.5v-7H2.5z"/>
    <rect x="8" y="3" width="7" height="1.8" rx="0.5"/>
    <rect x="8" y="7" width="7" height="1.8" rx="0.5"/>
    <rect x="8" y="11" width="7" height="1.8" rx="0.5"/>
  </svg>

  <!-- Shapes -->
  <svg *ngSwitchCase="'shapes'" viewBox="0 0 16 16" fill="currentColor">
    <circle cx="5" cy="5" r="3.5" fill="#0078d4" opacity="0.8"/>
    <rect x="6" y="6" width="7" height="7" rx="1" fill="#c43e1c"/>
  </svg>

  <!-- Text Box -->
  <svg *ngSwitchCase="'text-box'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="2" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-dasharray="2,2"/>
    <text x="4.5" y="11" font-size="9" font-family="serif" font-weight="bold">A</text>
  </svg>

  <!-- Table -->
  <svg *ngSwitchCase="'table'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2 2h12v12H2V2zm1 1v3h4V3H3zm5 0v3h5V3H8zm5 4H8v3h5V7zm0 4H8v3h5v-3zM7 14v-3H3v3h4zm-4-4h4V7H3v3z" fill="#0078d4"/>
  </svg>

  <!-- Picture -->
  <svg *ngSwitchCase="'picture'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="2" width="12" height="12" rx="1" fill="#d0e0e3"/>
    <circle cx="5.5" cy="5.5" r="1.5" fill="#f1c232"/>
    <path d="M2 12l3.5-4.5 2.5 3 2.5-3.5L14 12H2z" fill="#6aa84f"/>
  </svg>

  <!-- Themes -->
  <svg *ngSwitchCase="'themes'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="2" width="12" height="12" rx="1.5" fill="#f5f7fa" stroke="#c43e1c"/>
    <text x="4" y="9" font-size="7" font-weight="bold" fill="#000">Aa</text>
    <rect x="4" y="11" width="2" height="2" fill="#c43e1c"/>
    <rect x="7" y="11" width="2" height="2" fill="#3182ce"/>
    <rect x="10" y="11" width="2" height="2" fill="#6aa84f"/>
  </svg>

  <!-- Background Styles -->
  <svg *ngSwitchCase="'background-styles'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="2" y="2" width="12" height="12" rx="1.5" fill="#f0f0f0" stroke="currentColor"/>
    <path d="M2 8h12v6H2z" fill="#c43e1c" opacity="0.3"/>
  </svg>

  <!-- Transition -->
  <svg *ngSwitchCase="'transition'" viewBox="0 0 16 16" fill="currentColor">
    <rect x="1" y="3" width="7" height="10" rx="1" fill="#0078d4" opacity="0.4"/>
    <rect x="8" y="3" width="7" height="10" rx="1" fill="#0078d4"/>
    <path d="M6 7l3 1.5-3 1.5V7z" fill="#ffffff"/>
  </svg>

  <!-- Search -->
  <svg *ngSwitchCase="'search'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
  </svg>

  <!-- Present -->
  <svg *ngSwitchCase="'present'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h11A1.5 1.5 0 0 1 15 2.5v9a1.5 1.5 0 0 1-1.5 1.5H9v2h2a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1h2v-2H2.5A1.5 1.5 0 0 1 1 11.5v-9zm1.5-.5a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-11z"/>
    <polygon points="6.5,4.5 10.5,7 6.5,9.5" fill="currentColor"/>
  </svg>

  <!-- Chevron Down -->
  <svg *ngSwitchCase="'chevron-down'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M4.5 6l3.5 3.5L11.5 6l.7.7-4.2 4.2-4.2-4.2.7-.7z"/>
  </svg>

  <!-- Add-ins -->
  <svg *ngSwitchCase="'addins'" viewBox="0 0 16 16" fill="none">
    <rect x="2.5" y="2.5" width="4.5" height="4.5" rx="0.75" fill="#0078D4"/>
    <rect x="9" y="2.5" width="4.5" height="4.5" rx="0.75" fill="#28A8EA"/>
    <rect x="2.5" y="9" width="4.5" height="4.5" rx="0.75" fill="#00B294"/>
    <rect x="9" y="9" width="4.5" height="4.5" rx="0.75" fill="#FFB900"/>
  </svg>

  <!-- Cameo -->
  <svg *ngSwitchCase="'cameo'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 1a5 5 0 0 0-5 5v4a5 5 0 0 0 10 0V6a5 5 0 0 0-5-5zm4 9a4 4 0 0 1-8 0V6a4 4 0 0 1 8 0v4z"/>
    <circle cx="8" cy="5.5" r="1.75"/>
    <path d="M5.5 10c0-1.4 1.1-2.5 2.5-2.5s2.5 1.1 2.5 2.5v.5h-5V10z"/>
  </svg>

  <!-- Comment -->
  <svg *ngSwitchCase="'comment'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v7a1.5 1.5 0 0 1-1.5 1.5H5.5L2.7 14.3a.5.5 0 0 1-.7-.4V3.5zm1.5-.5a.5.5 0 0 0-.5.5v8.8l2.3-1.8H12.5a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.5-.5h-9z"/>
    <path d="M4.5 5.5h7v1h-7zm0 2.5h5v1h-5z"/>
  </svg>

  <!-- Designer -->
  <svg *ngSwitchCase="'designer'" viewBox="0 0 16 16" fill="#C43E1C">
    <path d="M8 1l1.5 3.5L13 6l-3.5 1.5L8 11 6.5 7.5 3 6l3.5-1.5L8 1z"/>
    <path d="M12.5 10l.75 1.75 1.75.75-1.75.75-.75 1.75-.75-1.75-1.75-.75 1.75-.75.75-1.75z"/>
    <path d="M3.5 10.5l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5.5-1z"/>
  </svg>

  <!-- Dictate -->
  <svg *ngSwitchCase="'dictate'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 1.5a2.5 2.5 0 0 0-2.5 2.5v5a2.5 2.5 0 0 0 5 0V4a2.5 2.5 0 0 0-2.5-2.5zm1.5 7.5a1.5 1.5 0 0 1-3 0V4a1.5 1.5 0 0 1 3 0v5z"/>
    <path d="M4 7.5a.5.5 0 0 0-1 0 5 5 0 0 0 4.5 4.975V14H5.5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1H8.5v-1.525A5 5 0 0 0 13 7.5a.5.5 0 0 0-1 0 4 4 0 0 1-8 0z"/>
    <circle cx="12" cy="3" r="1.5" fill="#D83B01"/>
  </svg>

  <!-- Link -->
  <svg *ngSwitchCase="'link'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M6.854 9.854a.5.5 0 0 1-.708 0l-2-2a2.5 2.5 0 0 1 3.536-3.536l1.5 1.5a.5.5 0 1 1-.708.708l-1.5-1.5a1.5 1.5 0 1 0-2.122 2.122l2 2a.5.5 0 0 1 0 .708zm2.292-3.708a.5.5 0 0 1 .708 0l2 2a2.5 2.5 0 0 1-3.536 3.536l-1.5-1.5a.5.5 0 1 1 .708-.708l1.5 1.5a1.5 1.5 0 0 0 2.122-2.122l-2-2a.5.5 0 0 1 0-.708z"/>
    <path d="M5.793 10.207a.5.5 0 0 1 0-.707l4.414-4.414a.5.5 0 1 1 .707.707L6.5 10.207a.5.5 0 0 1-.707 0z"/>
  </svg>

  <!-- Action -->
  <svg *ngSwitchCase="'action'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M3 1v11.5l3.5-3.5 2 4.5 1.5-.7-2-4.5 4.5-.3L3 1z"/>
    <path d="M12 1.5l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5.5-1z" fill="#d13438"/>
  </svg>

  <!-- Equation -->
  <svg *ngSwitchCase="'equation'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M2.5 3.5A.5.5 0 0 1 3 3h10a.5.5 0 0 1 0 1h-2v8a1 1 0 0 1-1 1 .5.5 0 0 1 0-1 .5.5 0 0 0 .5-.5V4H6v7.5a1.5 1.5 0 0 1-1.5 1.5.5.5 0 0 1 0-1 .5.5 0 0 0 .5-.5V4H3a.5.5 0 0 1-.5-.5z"/>
  </svg>

  <!-- Screen Recording -->
  <svg *ngSwitchCase="'screen-recording'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h11A1.5 1.5 0 0 1 15 2.5v8a1.5 1.5 0 0 1-1.5 1.5H9v1h2a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1h2v-1H2.5A1.5 1.5 0 0 1 1 10.5v-8zm1.5-.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-8a.5.5 0 0 0-.5-.5h-11z"/>
    <circle cx="8" cy="6.5" r="2" fill="#d13438"/>
  </svg>

  <!-- Media -->
  <svg *ngSwitchCase="'media'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h7A1.5 1.5 0 0 1 11 3.5V6l3.1-2.1A1 1 0 0 1 15.5 4.7v6.6a1 1 0 0 1-1.4.85L11 10v2.5A1.5 1.5 0 0 1 9.5 14h-7A1.5 1.5 0 0 1 1 12.5v-9zM2.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-7zm8.5 4.3v1.4l3.5 2.4V4.9L11 7.3z"/>
  </svg>

  <!-- Sound -->
  <svg *ngSwitchCase="'sound'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 2.5a.5.5 0 0 0-.8-.4L4.3 4.5H2A1.5 1.5 0 0 0 .5 6v4A1.5 1.5 0 0 0 2 11.5h2.3l2.9 2.4a.5.5 0 0 0 .8-.4V2.5zm-1 1.2v8.6L4.7 10.5H2a.5.5 0 0 1-.5-.5V6a.5.5 0 0 1 .5-.5h2.7L7 3.7zm4.3 1.8a.5.5 0 0 1 .7 0 4.5 4.5 0 0 1 0 6.4.5.5 0 1 1-.7-.7 3.5 3.5 0 0 0 0-5 .5.5 0 0 1 0-.7zm1.8-1.8a.5.5 0 0 1 .7 0 7 7 0 0 1 0 9.9.5.5 0 1 1-.7-.7 6 6 0 0 0 0-8.5.5.5 0 0 1 0-.7z"/>
  </svg>

  <!-- Symbols -->
  <svg *ngSwitchCase="'symbols'" viewBox="0 0 16 16" fill="currentColor">
    <path d="M10.8 12.5h2.7a.5.5 0 1 0 0-1h-2.1c.4-.7.6-1.5.6-2.5 0-2.2-1.8-4-4-4s-4 1.8-4 4c0 1 .2 1.8.6 2.5H2.5a.5.5 0 0 0 0 1h2.7c.8 0 1.5-.5 1.8-1.2.3.1.6.2 1 .2.4 0 .7-.1 1-.2.3.7 1 1.2 1.8 1.2zM5 9c0-1.7 1.3-3 3-3s3 1.3 3 3c0 .8-.3 1.6-.8 2.2-.4-.2-.8-.2-1.2-.2h-2c-.4 0-.8 0-1.2.2C5.3 10.6 5 9.8 5 9z"/>
  </svg>

  <!-- Default generic icon -->
  <svg *ngSwitchDefault viewBox="0 0 16 16" fill="currentColor">
    <rect x="3" y="3" width="10" height="10" rx="1" fill="none" stroke="currentColor"/>
  </svg>
</span>
